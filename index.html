<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Hour Planner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--bg2:#181b24;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);--text:#f0f0f0;--text2:#888ea8;--accent:#7ec8e3;--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem}
    .lang-toggle{position:fixed;top:1.25rem;right:1.25rem;display:flex;gap:2px;background:var(--bg2);border:.5px solid var(--border2);border-radius:8px;padding:3px;z-index:100}
    .lang-toggle button{font-size:11px;font-weight:500;padding:4px 10px;border:none;border-radius:5px;background:transparent;color:var(--text2);cursor:pointer;letter-spacing:.04em;transition:background .15s,color .15s;font-family:var(--font)}
    .lang-toggle button.active{background:var(--text);color:var(--bg)}
    h1{font-size:18px;font-weight:500;letter-spacing:.04em;margin-bottom:.25rem}
    .subtitle{font-size:12px;color:var(--text2);margin-bottom:1.75rem;letter-spacing:.06em;text-transform:uppercase}
    .controls{display:flex;gap:8px;margin-bottom:.5rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
    .controls input[type="date"]{flex:0 0 148px}
    .controls input,.controls button{font-size:13px;padding:8px 12px;border-radius:8px;border:.5px solid var(--border2);background:var(--bg2);color:var(--text);outline:none;font-family:var(--font)}
    .controls input:focus{border-color:var(--accent)}
    .controls button{flex:0 0 auto;padding:8px 20px;background:var(--text);color:var(--bg);border:none;cursor:pointer;font-weight:500;transition:opacity .15s}
    .controls button:hover{opacity:.85}
    /* autocomplete */
    .ac-wrap{position:relative;flex:1;min-width:200px}
    .ac-wrap input{width:100%}
    .ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:.5px solid var(--border2);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:200;display:none}
    .ac-dropdown.open{display:block}
    .ac-item{padding:9px 13px;cursor:pointer;border-bottom:.5px solid var(--border);transition:background .1s}
    .ac-item:last-child{border-bottom:none}
    .ac-item:hover,.ac-item.focused{background:rgba(255,255,255,.06)}
    .ac-item-name{font-size:13px;color:var(--text)}
    .ac-item-sub{font-size:11px;color:var(--text2);margin-top:1px}
    .ac-msg{padding:10px 13px;font-size:12px;color:var(--text2)}
    .hint{font-size:11px;color:var(--text2);margin-bottom:1.75rem;text-align:center}
    .error{font-size:13px;color:#e57373;margin-bottom:1rem;display:none}
    .loading{font-size:13px;color:var(--text2);margin-bottom:1rem;display:none}
    .ring-outer{position:relative;width:420px;height:420px}
    svg#ring{width:420px;height:420px;overflow:visible}
    .info-card{position:absolute;background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:20;min-width:130px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
    .info-card.visible{opacity:1}
    .info-card .ic-icon{font-size:16px;margin-bottom:3px}
    .info-card .ic-name{font-size:11px;color:var(--text2);margin-bottom:2px}
    .info-card .ic-time{font-size:18px;font-weight:500;color:var(--text);margin-bottom:3px}
    .info-card .ic-desc{font-size:11px;color:var(--text2);line-height:1.4;max-width:160px;white-space:normal}
    .cards-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:1.75rem;max-width:560px;width:100%}
    .card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;flex:1 1 110px;max-width:128px;min-width:100px;transition:border-color .15s,background .15s;cursor:default}
    .card.highlight{border-color:var(--border2);background:#1e2130}
    .card.active{border-color:var(--accent)!important}
    .card-dot{width:8px;height:8px;border-radius:50%;margin-bottom:6px}
    .card-emoji{font-size:18px;margin-bottom:5px}
    .card-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;line-height:1.3}
    .card-time{font-size:17px;font-weight:600;color:var(--text);margin-bottom:3px;letter-spacing:-.02em}
    .card-duration{font-size:10px;color:var(--text2);margin-bottom:4px}
    .card-desc{font-size:10.5px;color:var(--text2);line-height:1.45}
    @media(max-width:480px){.ring-outer,svg#ring{width:340px;height:340px}.card{max-width:none;flex:1 1 140px}.lang-toggle{top:.75rem;right:.75rem}}
  </style>
</head>
<body>
  <div class="lang-toggle">
    <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
  <h1>Golden Hour Planner</h1>
  <p class="subtitle" id="t-subtitle"></p>
  <div class="controls">
    <div class="ac-wrap">
      <input type="text" id="location" autocomplete="off" />
      <div class="ac-dropdown" id="ac-dropdown"></div>
    </div>
    <input type="date" id="date" />
    <button id="t-search" onclick="commitAndRun()"></button>
  </div>
  <div class="error" id="error"></div>
  <div class="loading" id="loading"></div>
  <p class="hint" id="t-hint"></p>
  <div class="ring-outer" id="ring-outer">
    <svg id="ring" viewBox="0 0 420 420"></svg>
    <div class="info-card" id="info-card">
      <div class="ic-icon" id="ic-icon"></div>
      <div class="ic-name" id="ic-name"></div>
      <div class="ic-time" id="ic-time"></div>
      <div class="ic-desc" id="ic-desc"></div>
    </div>
  </div>
  <div class="cards-row" id="cards-row"></div>

  <script>
  const I18N={
    zh:{subtitle:"拍摄时段规划工具",placeholder:"输入地点名称，如纽约、北京…",search:"查询",loading:"正在查询位置…",hint:"悬停圆环标记查看详情 · 底部卡片显示完整时段信息",errLoc:"请输入并从列表中选择一个地点",errDate:"请选择日期",errNotFound:"找不到该地点，请换个关键词试试",errFail:"查询失败，请重试",searching:"搜索中…",noResult:"未找到结果",durFmt:m=>m<60?m+" 分钟":Math.floor(m/60)+"h "+m%60+"m",timeFmt:d=>d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false}),points:[{label:"天文晨光",desc:"天空开始微亮，适合星轨收尾"},{label:"蓝调（晨）",desc:"深蓝柔光，无阴影，最纯净天空"},{label:"黄金时段（晨）",desc:"暖橙侧光，长阴影，最佳拍摄窗口"},{label:"日出",desc:"太阳刚出地平线"},{label:"日落",desc:"太阳触碰地平线"},{label:"黄金时段（昏）",desc:"暖橙侧光，长阴影，最佳拍摄窗口"},{label:"蓝调（昏）",desc:"深蓝柔光，城市灯光刚亮起"},{label:"天文暮光",desc:"完全黑暗，适合星空摄影"}]},
    en:{subtitle:"Photography Light Planner",placeholder:"Type a location, e.g. New York, Beijing…",search:"Search",loading:"Looking up location…",hint:"Hover markers on the ring for details · Full info in cards below",errLoc:"Please select a location from the list",errDate:"Please select a date",errNotFound:"Location not found — try a different keyword",errFail:"Query failed, please try again",searching:"Searching…",noResult:"No results found",durFmt:m=>m<60?m+" min":Math.floor(m/60)+"h "+m%60+"m",timeFmt:d=>d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true}),points:[{label:"Astro Dawn",desc:"Sky begins to lighten — great for star trail finales"},{label:"Blue Hour (AM)",desc:"Deep blue diffused light, no harsh shadows"},{label:"Golden Hour (AM)",desc:"Warm side light, long shadows — prime shooting window"},{label:"Sunrise",desc:"Sun reaches the horizon"},{label:"Sunset",desc:"Sun touches the horizon"},{label:"Golden Hour (PM)",desc:"Warm side light, long shadows — prime shooting window"},{label:"Blue Hour (PM)",desc:"Deep blue light, city lights just switching on"},{label:"Astro Dusk",desc:"Full darkness — ideal for astrophotography"}]}
  };

  let lang="zh",lastRenderData=null;
  function setLang(l){lang=l;document.getElementById("btn-zh").classList.toggle("active",l==="zh");document.getElementById("btn-en").classList.toggle("active",l==="en");applyStaticText();if(lastRenderData)buildCards(lastRenderData.T)}
  function applyStaticText(){const t=I18N[lang];document.getElementById("t-subtitle").textContent=t.subtitle;document.getElementById("location").placeholder=t.placeholder;document.getElementById("t-search").textContent=t.search;document.getElementById("t-hint").textContent=t.hint;document.getElementById("loading").textContent=t.loading}
  // timezone offset in minutes derived from longitude (15° = 1 hour)
  let targetTzOffset = 0; // minutes from UTC, set when location is selected

  function localDate(d){
    // SunCalc returns JS Date objects (UTC internally)
    // d.getTime() is ms since epoch (UTC)
    // Just add target tz offset directly — no browser offset needed
    return new Date(d.getTime() + targetTzOffset * 60000);
  }
  function fmt(d){
    if(!d||isNaN(d))return"—";
    return I18N[lang].timeFmt(localDate(d));
  }
  function durMin(a,b){if(!a||!b||isNaN(a)||isNaN(b))return null;const m=Math.round((b-a)/60000);return m>0?I18N[lang].durFmt(m):null}

  // ── Autocomplete ──
  let acTimer=null,selectedGeo=null,focusedIdx=-1;
  const locInput=document.getElementById("location");
  const acDrop=document.getElementById("ac-dropdown");

  locInput.addEventListener("input",()=>{
    selectedGeo=null;
    const q=locInput.value.trim();
    if(q.length<2){closeDrop();return}
    clearTimeout(acTimer);
    acTimer=setTimeout(()=>fetchSug(q),300);
  });
  locInput.addEventListener("keydown",e=>{
    const items=acDrop.querySelectorAll(".ac-item");
    if(e.key==="ArrowDown"){e.preventDefault();focusedIdx=Math.min(focusedIdx+1,items.length-1);hilite(items)}
    else if(e.key==="ArrowUp"){e.preventDefault();focusedIdx=Math.max(focusedIdx-1,0);hilite(items)}
    else if(e.key==="Enter"){if(focusedIdx>=0&&items[focusedIdx])items[focusedIdx].click();else commitAndRun()}
    else if(e.key==="Escape")closeDrop();
  });
  document.addEventListener("click",e=>{if(!e.target.closest(".ac-wrap"))closeDrop()});

  function hilite(items){items.forEach((el,i)=>el.classList.toggle("focused",i===focusedIdx));if(items[focusedIdx])items[focusedIdx].scrollIntoView({block:"nearest"})}

  async function fetchSug(q){
    acDrop.innerHTML='<div class="ac-msg">'+I18N[lang].searching+"</div>";
    acDrop.classList.add("open");focusedIdx=-1;
    try{
      const res=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=6&language="+(lang==="zh"?"zh":"en")+"&format=json");
      const data=await res.json();
      const results=data.results||[];
      if(!results.length){acDrop.innerHTML='<div class="ac-msg">'+I18N[lang].noResult+"</div>";return}
      acDrop.innerHTML="";focusedIdx=-1;
      results.forEach(r=>{
        const name=r.name||"";
        const sub=[r.admin1,r.admin2,r.country].filter(Boolean).join(", ");
        const display=[r.name,r.admin1,r.country].filter(Boolean).join(", ");
        const item=document.createElement("div");
        item.className="ac-item";
        item.innerHTML='<div class="ac-item-name">'+name+"</div>"+(sub?'<div class="ac-item-sub">'+sub+"</div>":"");
        item.addEventListener("mousedown",e=>e.preventDefault());
        item.addEventListener("click",()=>{
          selectedGeo={lat:r.latitude,lon:r.longitude,display};
          targetTzOffset=Math.round(r.longitude/15)*60; // rough solar tz offset in minutes
          locInput.value=display;
          closeDrop();
          runRender();
        });
        acDrop.appendChild(item);
      });
    }catch(e){closeDrop()}
  }

  function closeDrop(){acDrop.classList.remove("open");focusedIdx=-1}

  function commitAndRun(){
    if(selectedGeo){runRender();return}
    const q=locInput.value.trim();
    if(!q){showErr(I18N[lang].errLoc);return}
    const dateVal=document.getElementById("date").value;
    if(!dateVal){showErr(I18N[lang].errDate);return}
    document.getElementById("loading").style.display="block";
    document.getElementById("error").style.display="none";
    fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language=en&format=json")
      .then(r=>r.json())
      .then(data=>{
        document.getElementById("loading").style.display="none";
        if(!data.results?.length){showErr(I18N[lang].errNotFound);return}
        const r=data.results[0];
        selectedGeo={lat:r.latitude,lon:r.longitude,display:[r.name,r.admin1,r.country].filter(Boolean).join(", ")};
        targetTzOffset=Math.round(r.longitude/15)*60;
        locInput.value=selectedGeo.display;
        runRender();
      })
      .catch(()=>{document.getElementById("loading").style.display="none";showErr(I18N[lang].errFail)});
  }

  function showErr(msg){const e=document.getElementById("error");e.textContent=msg;e.style.display="block"}
  function runRender(){
    const dateVal=document.getElementById("date").value;
    document.getElementById("error").style.display="none";
    if(!selectedGeo){showErr(I18N[lang].errLoc);return}
    if(!dateVal){showErr(I18N[lang].errDate);return}
    render(selectedGeo.lat,selectedGeo.lon,selectedGeo.display,dateVal);
  }

  document.getElementById("date").value=new Date().toISOString().split("T")[0];
  document.getElementById("date").addEventListener("change",()=>{if(selectedGeo)runRender()});
  applyStaticText();

  // ── Ring ──
  const cx=210,cy=210,OR=155,IR=95,MR=(OR+IR)/2,ns="http://www.w3.org/2000/svg";
  const SEGS=[
    {from:"nightEnd",     to:"nauticalDawn",  color:"url(#gNight)"},
    {from:"nauticalDawn", to:"goldenHourEnd", color:"url(#gBlueAM)"},
    {from:"goldenHourEnd",to:"sunrise",       color:"url(#gGoldAM)"},
    {from:"sunrise",      to:"goldenHour",    color:"url(#gDay)"},
    {from:"goldenHour",   to:"sunset",        color:"url(#gGoldPM)"},
    {from:"sunset",       to:"nauticalDusk",  color:"url(#gSunset)"},
    {from:"nauticalDusk", to:"night",         color:"url(#gBluePM)"},
    {from:"night",        to:"__midnight__",  color:"url(#gNight)"},
  ];
  const PM=[{key:"nightEnd",emoji:"🌑",dotColor:"#4a5580",highlight:false},{key:"nauticalDawn",emoji:"🌫️",dotColor:"#7ec8e3",highlight:true},{key:"goldenHourEnd",emoji:"🌅",dotColor:"#f5c242",highlight:true},{key:"sunrise",emoji:"☀️",dotColor:"#f0a050",highlight:false},{key:"sunset",emoji:"🌇",dotColor:"#e07030",highlight:false},{key:"goldenHour",emoji:"🌆",dotColor:"#f5c242",highlight:true},{key:"nauticalDusk",emoji:"🌉",dotColor:"#7ec8e3",highlight:true},{key:"night",emoji:"🌃",dotColor:"#4a5580",highlight:false}];
  const pts=()=>PM.map((m,i)=>({...m,...I18N[lang].points[i]}));

  function svgEl(tag,attrs,parent){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(parent)parent.appendChild(e);return e}
  function tAngle(d){
    if(!d||isNaN(d))return 0;
    const local=localDate(d);
    return(local.getHours()+local.getMinutes()/60)/24*360-90;
  }
  function polar(a,r){const rad=a*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)}}
  function wedge(a0,a1,ro,ri){
    let a1a=a1<=a0?a1+360:a1;
    // clamp to max 360 degrees
    if(a1a-a0>360)a1a=a0+360;
    const lg=(a1a-a0)>180?1:0;
    const so=polar(a0,ro),eo=polar(a1a,ro),si=polar(a0,ri),ei=polar(a1a,ri);
    return"M"+so.x+","+so.y+" A"+ro+","+ro+" 0 "+lg+" 1 "+eo.x+","+eo.y+" L"+ei.x+","+ei.y+" A"+ri+","+ri+" 0 "+lg+" 0 "+si.x+","+si.y+" Z";
  }
  function setActive(key){document.querySelectorAll(".card").forEach(c=>c.classList.toggle("active",c.dataset.key===key))}

  function render(lat,lon,displayName,dateVal){
    const date=new Date(dateVal+"T12:00:00");
    const T=SunCalc.getTimes(date,lat,lon);
    const nm=new Date(date);nm.setDate(nm.getDate()+1);nm.setHours(0,0,0,0);T.__midnight__=nm;
    lastRenderData={T,displayName,dateVal};
    const svg=document.getElementById("ring");svg.innerHTML="";
    // inject gradient defs
    const defs=document.createElementNS(ns,"defs");
    const grads=[
      {id:"gNight",   c1:"#07091a",c2:"#131729"},
      {id:"gBlueAM",  c1:"#0d2a4a",c2:"#1a5a8a"},
      {id:"gGoldAM",  c1:"#b84e00",c2:"#e8820a"},
      {id:"gDay",     c1:"#d8d0bc",c2:"#ede8da"},
      {id:"gGoldPM",  c1:"#b84e00",c2:"#e8820a"},
      {id:"gSunset",  c1:"#6b1e08",c2:"#c04010"},
      {id:"gBluePM",  c1:"#0d2a4a",c2:"#1a5a8a"},
    ];
    grads.forEach(g=>{
      const grad=document.createElementNS(ns,"radialGradient");
      grad.setAttribute("id",g.id);
      grad.setAttribute("cx","50%");grad.setAttribute("cy","50%");
      grad.setAttribute("r","50%");grad.setAttribute("gradientUnits","userSpaceOnUse");
      grad.setAttribute("fx",cx);grad.setAttribute("fy",cy);
      grad.setAttribute("r",OR);
      const s1=document.createElementNS(ns,"stop");s1.setAttribute("offset","0%");s1.setAttribute("stop-color",g.c2);
      const s2=document.createElementNS(ns,"stop");s2.setAttribute("offset","100%");s2.setAttribute("stop-color",g.c1);
      grad.appendChild(s1);grad.appendChild(s2);defs.appendChild(grad);
    });
    svg.appendChild(defs);
    svgEl("circle",{cx,cy,r:OR+22,fill:"#181b24"},svg);
    svgEl("circle",{cx,cy,r:OR+22,fill:"none",stroke:"rgba(255,255,255,.08)","stroke-width":"0.5"},svg);
    SEGS.forEach(s=>{const t0=T[s.from],t1=T[s.to];if(!t0||isNaN(t0)||!t1||isNaN(t1))return;svgEl("path",{d:wedge(tAngle(t0),tAngle(t1),OR,IR),fill:s.color},svg)});
    svgEl("circle",{cx,cy,r:IR,fill:"#0f1117"},svg);
    svgEl("circle",{cx,cy,r:IR,fill:"none",stroke:"rgba(255,255,255,.08)","stroke-width":"0.5"},svg);
    svgEl("circle",{cx,cy,r:OR,fill:"none",stroke:"rgba(255,255,255,.08)","stroke-width":"0.5"},svg);
    for(let h=0;h<24;h++){const a=(h/24)*360-90,major=h%6===0;const p1=polar(a,OR-(major?10:4)),p2=polar(a,OR);svgEl("line",{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:"rgba(255,255,255,.15)","stroke-width":major?1.5:0.5},svg);if(major){const tp=polar(a,OR+11);const txt=svgEl("text",{x:tp.x,y:tp.y,"text-anchor":"middle","dominant-baseline":"middle",fill:"rgba(255,255,255,.3)","font-size":"9","font-family":"-apple-system,sans-serif"},svg);txt.textContent=h+"h"}}
    const now=new Date();
    if(now.toDateString()===date.toDateString()){const a=tAngle(now),p1=polar(a,IR+4),p2=polar(a,OR-4);svgEl("line",{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:"white","stroke-width":"2",opacity:"0.85"},svg);svgEl("circle",{cx:p2.x,cy:p2.y,r:"3",fill:"white"},svg)}
    const fo=document.createElementNS(ns,"foreignObject");fo.setAttribute("x",cx-62);fo.setAttribute("y",cy-30);fo.setAttribute("width",124);fo.setAttribute("height",60);
    const inner=document.createElement("div");inner.style.cssText="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60px;";
    inner.innerHTML='<div style="font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.3">'+displayName+'</div><div style="font-size:12px;font-weight:500;color:rgba(255,255,255,.85);margin-top:3px">'+dateVal+"</div>";
    fo.appendChild(inner);svg.appendChild(fo);
    pts().forEach(pt=>{
      const t=T[pt.key];if(!t||isNaN(t))return;
      const a=tAngle(t),pm=polar(a,MR),pl=polar(a,OR+30),anchor=pl.x<cx-5?"end":pl.x>cx+5?"start":"middle";
      const dot=svgEl("circle",{cx:pm.x,cy:pm.y,r:pt.highlight?5:3.5,fill:pt.dotColor,stroke:"rgba(255,255,255,.2)","stroke-width":"1",style:"cursor:pointer"},svg);
      const p1=polar(a,OR+1),p2=polar(a,OR+20);svgEl("line",{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:pt.highlight?pt.dotColor:"rgba(255,255,255,.2)","stroke-width":"1"},svg);
      const tg=svgEl("g",{style:"cursor:pointer"},svg);
      const tTxt=svgEl("text",{x:pl.x,y:pl.y-4,"text-anchor":anchor,"dominant-baseline":"auto",fill:pt.highlight?pt.dotColor:"rgba(255,255,255,.4)","font-size":pt.highlight?"11":"9.5","font-weight":pt.highlight?"500":"400","font-family":"-apple-system,sans-serif"},tg);tTxt.textContent=fmt(t);
      const nTxt=svgEl("text",{x:pl.x,y:pl.y+8,"text-anchor":anchor,"dominant-baseline":"auto",fill:pt.highlight?"rgba(255,255,255,.6)":"rgba(255,255,255,.25)","font-size":"8.5","font-family":"-apple-system,sans-serif"},tg);nTxt.textContent=pt.label;
      [dot,tg].forEach(el=>{el.addEventListener("mouseenter",()=>{showCard(pt,t,pm);setActive(pt.key)});el.addEventListener("mouseleave",()=>{hideCard();setActive(null)})});
    });
    buildCards(T);
  }

  function buildCards(T){
    lastRenderData=lastRenderData?{...lastRenderData,T}:{T};
    const row=document.getElementById("cards-row");row.innerHTML="";
    const points=pts();
    points.forEach((pt,i)=>{
      const t=T[pt.key],nextT=points[i+1]?T[points[i+1].key]:null,dur=durMin(t,nextT);
      const card=document.createElement("div");card.className="card"+(pt.highlight?" highlight":"");card.dataset.key=pt.key;
      card.innerHTML='<div class="card-dot" style="background:'+pt.dotColor+'"></div><div class="card-emoji">'+pt.emoji+'</div><div class="card-label">'+pt.label+'</div><div class="card-time">'+fmt(t)+"</div>"+(dur?'<div class="card-duration">→ '+dur+"</div>":"")+'<div class="card-desc">'+pt.desc+"</div>";
      card.addEventListener("mouseenter",()=>setActive(pt.key));card.addEventListener("mouseleave",()=>setActive(null));
      row.appendChild(card);
    });
  }

  function showCard(pt,t,pm){
    const card=document.getElementById("info-card"),outer=document.getElementById("ring-outer");
    const rect=outer.getBoundingClientRect(),scale=420/rect.width,px=pm.x/scale,py=pm.y/scale;
    document.getElementById("ic-icon").textContent=pt.emoji;document.getElementById("ic-name").textContent=pt.label;document.getElementById("ic-time").textContent=fmt(t);document.getElementById("ic-desc").textContent=pt.desc;
    let left=px+14,top=py-20;if(left+170>rect.width)left=px-184;if(top+90>rect.height)top=rect.height-98;if(top<0)top=8;
    card.style.left=left+"px";card.style.top=top+"px";card.classList.add("visible");
  }
  function hideCard(){document.getElementById("info-card").classList.remove("visible")}
  </script>
</body>
</html>
